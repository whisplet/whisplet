<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Whisplet</title>
<meta name="description" content="Meeting copilot for Windows that runs on your own machine. Private beta autumn 2026.">
<style>
  :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #5c5f66; --bg: #fafafa; --line: #d9d9de; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8e8ec; --muted: #9a9ca3; --bg: #121215; --line: #2a2a30; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; margin: 18vh auto 0; padding: 0 1.5rem; }
  h1 { font-size: 2.4rem; letter-spacing: -0.02em; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  .muted { color: var(--muted); }
  a { color: inherit; }
  footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Whisplet</h1>
  <p>A meeting copilot for Windows that runs on your own machine. Transcripts, speakers and notes stay local.</p>
  <p class="muted">Private beta: autumn 2026.</p>
  <p>Say hello: <a href="mailto:hello@whisplet.ai">hello@whisplet.ai</a></p>
  <p class="muted"><a href="/trust">What leaves your machine</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/beta">Beta terms</a></p>
  <footer>This page sets no cookies and loads no scripts.</footer>
</main>
</body>
</html>
